<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Newstock — 뉴스로 배우는 모의 주식투자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f7fa;--surface:#ffffff;--surface2:#f0f2f5;--surface3:#e8ebf0;
  --accent:#00A878;--accent2:#1A3A5C;
  --warn:#B8A030;--danger:#ef4444;
  --text:#000000;--text-muted:#888888;--text-dim:#555555;
  --border:rgba(0,0,0,0.09);--coin:#B8A030;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Noto Sans KR',-apple-system,sans-serif;
  min-height:100vh;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 10%,rgba(0,184,144,0.06),transparent),
    radial-gradient(ellipse 50% 40% at 80% 90%,rgba(59,130,246,0.05),transparent);
}
.screen{display:none;max-width:480px;margin:0 auto;padding:24px 18px;min-height:100vh;position:relative;z-index:1}
.screen.active{display:flex;flex-direction:column}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px}
.btn{border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;padding:14px 20px;transition:opacity .15s;font-family:'Noto Sans KR',sans-serif}
.btn:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-outline{background:var(--surface2);color:var(--text-dim);border:1px solid var(--border);width:100%}
.mono{font-family:'Space Mono','Courier New',monospace}
.fade-in{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes coinPop{0%{transform:scale(0) rotate(-20deg);opacity:0}65%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}

/* header */
.app-header{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:13px 18px;display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
}
.coin-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(184,160,48,0.08);border:1px solid rgba(184,160,48,0.2);
  border-radius:100px;padding:6px 13px;font-weight:700;color:var(--coin);
  font-family:'Space Mono',monospace;font-size:13px;
}

/* progress */
.progress-bar{display:flex;gap:6px;margin-bottom:16px}
.progress-seg{flex:1;height:4px;border-radius:2px;background:var(--surface3);transition:background .3s}
.progress-seg.done{background:var(--accent)}
.progress-seg.current{background:rgba(0,168,120,.3)}

/* time badge */
.time-badge{
  display:inline-block;padding:4px 12px;border-radius:100px;
  background:rgba(26,58,92,0.08);border:1px solid rgba(26,58,92,0.15);
  font-size:11px;font-weight:700;color:var(--accent2);letter-spacing:.5px;
  margin-bottom:10px;
}

/* answer buttons */
.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.answer-btn{
  padding:32px 16px;border-radius:14px;border:1.5px solid var(--border);
  background:var(--surface);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:8px;transition:transform .1s,border-color .15s,background .15s;
  font-family:'Noto Sans KR',sans-serif;
}
.answer-btn:hover{transform:scale(1.02)}
.answer-btn.up:hover{border-color:var(--accent);background:rgba(0,168,120,0.04)}
.answer-btn.down:hover{border-color:var(--danger);background:rgba(239,68,68,0.04)}
.answer-btn .icon{font-size:32px}
.answer-btn .label{font-size:16px;font-weight:700}

/* reveal */
.reveal{border-radius:14px;padding:28px;text-align:center}
.reveal.correct{background:rgba(0,168,120,0.08);border:1.5px solid rgba(0,168,120,0.25)}
.reveal.wrong{background:rgba(239,68,68,0.06);border:1.5px solid rgba(239,68,68,0.2)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--text-muted);font-weight:600;padding:8px 0;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 0;border-bottom:1px solid var(--border);color:var(--text)}

/* up/down chip */
.chip-up{font-family:'Space Mono',monospace;font-size:11px;padding:2px 7px;border-radius:5px;background:rgba(0,229,176,0.1);color:var(--accent)}
.chip-down{font-family:'Space Mono',monospace;font-size:11px;padding:2px 7px;border-radius:5px;background:rgba(239,68,68,0.1);color:var(--danger)}
</style>
</head>
<body>

<!-- ① 랜딩 -->
<div id="s-landing" class="screen active">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px">

    <div style="text-align:center">
      <div style="font-size:11px;color:var(--accent);font-weight:700;letter-spacing:2px;margin-bottom:14px">NEWSTOCK DEMO</div>
      <div style="font-size:30px;font-weight:900;line-height:1.25;margin-bottom:14px;color:var(--accent2)">
        뉴스로 배우는<br/>모의 주식투자
      </div>
      <div style="font-size:14px;color:var(--text-dim);line-height:1.8">
        과거 경제 뉴스를 읽고,<br/>
        <strong style="color:var(--text)">그 이후 주가가 올랐는지 내렸는지</strong> 맞혀보세요.<br/>
        정답을 맞히면 현금을 받아 모의 투자까지 할 수 있어요.
      </div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;gap:14px;align-items:center">
        <div style="font-size:22px">📰</div>
        <div>
          <div style="font-size:13px;font-weight:700;margin-bottom:2px">시기별 뉴스 읽기</div>
          <div style="font-size:12px;color:var(--text-muted)">1개월·3개월·6개월·12개월 전 실제 뉴스</div>
        </div>
      </div>
      <div style="display:flex;gap:14px;align-items:center">
        <div style="font-size:22px">📈</div>
        <div>
          <div style="font-size:13px;font-weight:700;margin-bottom:2px">상승/하락 예측</div>
          <div style="font-size:12px;color:var(--text-muted)">그 뉴스 이후 지금까지 주가 방향 맞히기</div>
        </div>
      </div>
      <div style="display:flex;gap:14px;align-items:center">
        <div style="font-size:22px">💰</div>
        <div>
          <div style="font-size:13px;font-weight:700;margin-bottom:2px">현금 적립 → 모의 투자</div>
          <div style="font-size:12px;color:var(--text-muted)">종목 언락 후 실시간 주가로 매수/매도</div>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" style="font-size:15px;padding:18px" onclick="startDemo()">
      삼성전자 퀴즈 시작하기 →
    </button>
    <div style="font-size:11px;color:var(--text-muted);text-align:center">고투홈 팀 × 하나금융TI · <strong style="color:var(--accent2)">Newstock</strong></div>
  </div>
</div>

<!-- ② 퀴즈 -->
<div id="s-quiz" class="screen">
  <div class="app-header">
    <div style="font-size:18px;font-weight:900;color:var(--accent2)">Newstock</div>
    <div class="coin-badge" id="header-coin">₩1,000,000</div>
  </div>
  <div id="quiz-content"></div>
</div>

<!-- ③ 결과 -->
<div id="s-result" class="screen">
  <div class="app-header">
    <div style="font-size:18px;font-weight:900;color:var(--accent2)">Newstock</div>
    <div class="coin-badge" id="result-coin">₩1,000,000</div>
  </div>
  <div id="result-content"></div>
</div>

<!-- ④ 포트폴리오 -->
<div id="s-portfolio" class="screen">
  <div class="app-header">
    <div style="font-size:18px;font-weight:900;color:var(--accent2)">Newstock</div>
    <div class="coin-badge" id="pf-coin">₩1,000,000</div>
  </div>
  <div id="portfolio-content"></div>
</div>

<script>
// ── 퀴즈 데이터: 삼성전자, 시기별 뉴스 4개 ───────────────
// 각 뉴스는 해당 시점에 실제로 있었을 법한 이슈.
// changeRate = 뉴스 시점 ~ 현재(2026.06 기준) 주가 변화.
const QUIZ_NEWS = [
  {
    timeLabel: '12개월 전',
    date: '2025-06-15',
    company: '삼성전자',
    ticker: '005930.KS',
    title: '삼성전자, HBM4 공급 본격화…엔비디아·AMD 동시 납품 확정',
    body: '삼성전자가 6세대 고대역폭메모리(HBM4) 양산을 시작하고 엔비디아와 AMD에 동시 납품을 확정했다. AI 가속기 시장 폭발적 성장 속에서 SK하이닉스에 빼앗겼던 점유율을 되찾을 수 있을지 주목된다.',
    sourceUrl: 'https://search.naver.com/search.naver?where=news&query=삼성전자+HBM4+공급+엔비디아&ds=2025.06.01&de=2025.07.31',
    direction: 'up',
    changeRate: 22.4,
    basePrice: 54680,
    currentPrice: 66940,
  },
  {
    timeLabel: '6개월 전',
    date: '2025-12-10',
    company: '삼성전자',
    ticker: '005930.KS',
    title: '삼성전자 파운드리 적자 지속…4분기 수익성 개선 안개',
    body: '삼성전자 파운드리(반도체 위탁생산) 사업부가 5분기 연속 적자를 이어가고 있다. TSMC와의 기술 격차가 좁혀지지 않는 가운데 주요 팹리스 고객사가 이탈하고 있다는 분석이다.',
    sourceUrl: 'https://search.naver.com/search.naver?where=news&query=삼성전자+파운드리+적자+실적&ds=2025.11.01&de=2025.12.31',
    direction: 'down',
    changeRate: -11.3,
    basePrice: 75480,
    currentPrice: 66940,
  },
  {
    timeLabel: '3개월 전',
    date: '2026-03-12',
    company: '삼성전자',
    ticker: '005930.KS',
    title: '삼성전자 1분기 잠정실적 영업이익 7.2조…예상치 상회',
    body: '삼성전자가 1분기 잠정실적으로 영업이익 7.2조원을 공시했다. 메모리 반도체 가격 반등과 HBM 출하 확대가 실적을 견인했다. 시장 예상치(5.8조원)를 크게 상회하며 하반기 전망도 긍정적으로 바뀌었다.',
    sourceUrl: 'https://search.naver.com/search.naver?where=news&query=삼성전자+1분기+잠정실적+영업이익&ds=2026.03.01&de=2026.04.30',
    direction: 'up',
    changeRate: 9.8,
    basePrice: 60970,
    currentPrice: 66940,
  },
  {
    timeLabel: '1개월 전',
    date: '2026-05-08',
    company: '삼성전자',
    ticker: '005930.KS',
    title: '삼성전자, 자사주 10조원 소각·분기 배당 확대 발표',
    body: '삼성전자가 자사주 10조원 규모를 소각하고 분기 배당을 15% 확대한다고 발표했다. 시장은 이를 주주가치 제고 의지의 표현으로 해석하며 외국인 순매수가 이어지고 있다.',
    sourceUrl: 'https://search.naver.com/search.naver?where=news&query=삼성전자+자사주+소각+배당+주주환원&ds=2026.05.01&de=2026.06.07',
    direction: 'up',
    changeRate: 4.7,
    basePrice: 63940,
    currentPrice: 66940,
  },
];

// ── 상태 ─────────────────────────────────────────────────
let state = {
  idx: 0,
  answers: [],
  reveals: [],
  showingReveal: false,
  coins: 1000000,
  portfolio: [
    { ticker: '005930.KS', name: '삼성전자',    quantity: 8,  avgCost: 60500,  currentPrice: 66940  },
    { ticker: '000660.KS', name: 'SK하이닉스',  quantity: 5,  avgCost: 138000, currentPrice: 199500 },
    { ticker: '034020.KS', name: '두산에너빌리티', quantity: 30, avgCost: 19800,  currentPrice: 22100  },
  ],
};

function updateCoinBadges() {
  const txt = `₩${state.coins.toLocaleString()}`;
  ['header-coin','result-coin','pf-coin'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = txt;
  });
}

// ── 화면 전환 ─────────────────────────────────────────────
function goTo(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  el.classList.add('active');
  window.scrollTo(0, 0);
  updateCoinBadges();
  if (id === 's-portfolio') renderPortfolio();
}

function startDemo() {
  state.idx = 0;
  state.answers = [];
  state.reveals = [];
  state.showingReveal = false;
  goTo('s-quiz');
  renderQuiz();
}

// ── 퀴즈 렌더 ────────────────────────────────────────────
function renderQuiz() {
  const news = QUIZ_NEWS[state.idx];
  const total = QUIZ_NEWS.length;

  const bars = QUIZ_NEWS.map((_, i) => {
    const cls = i < state.idx ? 'done' : i === state.idx ? 'current' : '';
    return `<div class="progress-seg ${cls}"></div>`;
  }).join('');

  let body = '';
  if (state.showingReveal) {
    const rev = state.reveals[state.reveals.length - 1];
    const prev = QUIZ_NEWS[state.idx - 1] || QUIZ_NEWS[state.idx];
    const cls = rev.correct ? 'correct' : 'wrong';
    const rateStr = `${prev.changeRate >= 0 ? '+' : ''}${prev.changeRate.toFixed(1)}%`;
    body = `
      <div class="reveal ${cls} fade-in">
        <div style="font-size:36px;margin-bottom:10px">${rev.correct ? '✅' : '❌'}</div>
        <div style="font-size:17px;font-weight:700;margin-bottom:8px">${rev.correct ? '정답!' : '오답!'}</div>
        <div style="font-size:13px;color:var(--text-dim)">
          ${prev.date} 이후 지금까지<br/>실제로
          <span class="mono" style="font-weight:700;color:${prev.direction === 'up' ? 'var(--accent)' : 'var(--danger)'}">
            ${rateStr} ${prev.direction === 'up' ? '상승' : '하락'}
          </span>했습니다
        </div>
        ${prev.sourceUrl ? `
        <a href="${prev.sourceUrl}" target="_blank" rel="noopener noreferrer"
          style="display:inline-flex;align-items:center;gap:5px;margin-top:14px;margin-bottom:16px;font-size:12px;color:var(--accent2);font-weight:600;text-decoration:none">
          📰 기사 원문 읽기 →
        </a>` : '<div style="margin-top:14px"></div>'}
        <button onclick="nextQuestion()"
          style="width:100%;padding:14px;border-radius:12px;border:none;background:var(--accent2);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif">
          ${state.idx >= QUIZ_NEWS.length ? '결과 보기 →' : '다음 뉴스 →'}
        </button>
      </div>`;
  } else {
    body = `
      <div class="answer-grid fade-in">
        <button class="answer-btn up" onclick="answer('up')">
          <span class="icon">📈</span>
          <span class="label" style="color:var(--accent)">상승</span>
        </button>
        <button class="answer-btn down" onclick="answer('down')">
          <span class="icon">📉</span>
          <span class="label" style="color:var(--danger)">하락</span>
        </button>
      </div>`;
  }

  document.getElementById('quiz-content').innerHTML = `
    <div style="margin-bottom:4px;font-size:11px;color:var(--text-muted)">${state.idx + 1} / ${total}</div>
    <div class="progress-bar">${bars}</div>

    <div class="card" style="margin-bottom:16px">
      <div class="time-badge">${news.timeLabel} 뉴스 · ${news.date}</div>
      <div style="font-size:15px;font-weight:700;line-height:1.55;margin-bottom:10px">${news.title}</div>
      <div style="font-size:12px;color:var(--text-dim);line-height:1.7">${news.body}</div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div style="font-size:13px;font-weight:700;margin-bottom:4px">
        이 뉴스가 나온 이후 지금까지,<br/>${news.company}의 주가는 어떻게 됐을까요?
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:4px">정답 시 +₩${[50000,100000,150000,200000][state.idx].toLocaleString()}</div>
    </div>

    ${body}
  `;
}

function answer(dir) {
  if (state.showingReveal) return;
  const news = QUIZ_NEWS[state.idx];
  const isCorrect = dir === news.direction;
  const coinsArr = [50000, 100000, 150000, 200000];
  if (isCorrect) state.coins += coinsArr[state.idx] ?? 50000;

  state.answers.push(dir);
  state.reveals.push({ userAnswer: dir, correct: isCorrect });
  state.idx++;
  state.showingReveal = true;

  renderQuiz();
  updateCoinBadges();
}

function nextQuestion() {
  state.showingReveal = false;
  if (state.idx >= QUIZ_NEWS.length) showResult();
  else renderQuiz();
}

// ── 결과 ────────────────────────────────────────────────
function showResult() {
  const score = state.reveals.filter(r => r.correct).length;
  const total = QUIZ_NEWS.length;
  const earned = state.reveals.reduce((s, r, i) => s + (r.correct ? [50000,100000,150000,200000][i] : 0), 0);
  const emoji = score === total ? '🎉' : score >= 2 ? '👍' : '😅';

  const rows = QUIZ_NEWS.map((n, i) => {
    const rev = state.reveals[i];
    const rateStr = `${n.changeRate >= 0 ? '+' : ''}${n.changeRate.toFixed(1)}%`;
    return `
      <tr>
        <td style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="font-size:12px;color:var(--text-muted)">${n.timeLabel} 뉴스</div>
          <div style="font-size:12px;font-weight:600;margin-top:2px">${n.title.slice(0, 28)}…</div>
        </td>
        <td style="padding:10px 0;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap">
          <span class="${n.direction === 'up' ? 'chip-up' : 'chip-down'}">${rateStr}</span>
        </td>
        <td style="padding:10px 0;border-bottom:1px solid var(--border);text-align:right;font-size:16px">
          ${rev.correct ? '✅' : '❌'}
        </td>
      </tr>`;
  }).join('');

  document.getElementById('result-content').innerHTML = `
    <div class="card" style="text-align:center;margin-bottom:16px;animation:coinPop .45s cubic-bezier(.34,1.56,.64,1)">
      <div style="font-size:44px;margin-bottom:12px">${emoji}</div>
      <div style="font-size:26px;font-weight:900;margin-bottom:6px;color:var(--accent2)">${score}/${total} 정답</div>
      <div style="font-size:15px;color:var(--accent);font-weight:700;margin-bottom:8px">+₩${earned.toLocaleString()} 획득</div>
      <div class="coin-badge" style="margin:0 auto">₩${state.coins.toLocaleString()}</div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div style="font-size:12px;color:var(--text-muted);font-weight:700;margin-bottom:10px">기간별 실제 주가 변동</div>
      <table class="tbl"><tbody>${rows}</tbody></table>
    </div>

    <div class="card" style="margin-bottom:16px;border-color:rgba(0,168,120,0.2);background:rgba(0,168,120,0.04)">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--accent2)">📊 삼성전자 실제 주가 차트</div>
      <div id="tv-widget" style="height:280px;border-radius:10px;overflow:hidden;background:var(--surface2)"></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
      <button class="btn btn-outline" onclick="startDemo()">다시 풀기</button>
      <button class="btn btn-primary" onclick="goTo('s-portfolio')">포트폴리오 보기 →</button>
    </div>
  `;

  goTo('s-result');

  setTimeout(() => {
    const container = document.getElementById('tv-widget');
    if (!container) return;
    container.innerHTML = `
      <iframe
        src="https://s.tradingview.com/widgetembed/?symbol=KRX%3A005930&interval=W&theme=light&style=1&locale=kr&toolbar_bg=%23f5f7fa&hide_top_toolbar=1&hide_legend=0"
        style="width:100%;height:100%;border:none"
        allowtransparency="true" scrolling="no" frameborder="0">
      </iframe>`;
  }, 300);
}

// ── 포트폴리오 ───────────────────────────────────────────
function renderPortfolio() {
  const pf = state.portfolio;
  const totalInvested = pf.reduce((s, h) => s + h.avgCost * h.quantity, 0);
  const totalCurrent  = pf.reduce((s, h) => s + h.currentPrice * h.quantity, 0);
  const totalPnl = totalCurrent - totalInvested;
  const totalPct = totalPnl / totalInvested * 100;
  const pfUp = totalPnl >= 0;

  const colors = ['#00A878','#1A3A5C','#B8A030'];

  const rows = pf.map((h, i) => {
    const pnl = (h.currentPrice - h.avgCost) * h.quantity;
    const pct = (h.currentPrice - h.avgCost) / h.avgCost * 100;
    const up = pnl >= 0;
    return `
      <tr>
        <td style="padding:12px 0;border-bottom:1px solid var(--border)">
          <div style="font-weight:700;font-size:13px">${h.name}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${h.quantity}주 · 평균 ₩${h.avgCost.toLocaleString()}</div>
        </td>
        <td style="padding:12px 0;border-bottom:1px solid var(--border);text-align:right">
          <div class="mono" style="font-size:13px;font-weight:700">₩${h.currentPrice.toLocaleString()}</div>
          <div style="font-size:11px;margin-top:2px">
            <span class="${up ? 'chip-up' : 'chip-down'}">${up ? '+' : ''}${pct.toFixed(1)}%</span>
          </div>
        </td>
        <td style="padding:12px 0;border-bottom:1px solid var(--border);text-align:right">
          <div style="font-size:13px;font-weight:700;color:${up ? 'var(--accent)' : 'var(--danger)'}">
            ${up ? '+' : ''}${pnl.toLocaleString()}원
          </div>
        </td>
      </tr>`;
  }).join('');

  document.getElementById('portfolio-content').innerHTML = `
    <div style="font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:4px">PORTFOLIO</div>
    <div style="font-size:20px;font-weight:900;color:var(--accent2);margin-bottom:20px">모의 투자 현황</div>

    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
        <div>
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">총 평가금액</div>
          <div class="mono" style="font-size:22px;font-weight:700;color:var(--accent2)">₩${totalCurrent.toLocaleString()}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">평가손익</div>
          <div class="mono" style="font-size:18px;font-weight:700;color:${pfUp ? 'var(--accent)' : 'var(--danger)'}">
            ${pfUp ? '+' : ''}${totalPnl.toLocaleString()}원
          </div>
          <div style="font-size:11px;color:${pfUp ? 'var(--accent)' : 'var(--danger)'}">
            ${pfUp ? '+' : ''}${totalPct.toFixed(1)}%
          </div>
        </div>
      </div>
      <canvas id="pf-chart" height="160"></canvas>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div style="font-size:12px;color:var(--text-muted);font-weight:700;margin-bottom:12px">보유 종목</div>
      <table class="tbl">
        <thead><tr>
          <th>종목</th>
          <th style="text-align:right">현재가</th>
          <th style="text-align:right">손익</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    <div class="card" style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">보유 현금</div>
        <div class="coin-badge">₩${state.coins.toLocaleString()}</div>
      </div>
      <button class="btn btn-primary" style="width:auto;padding:12px 20px" onclick="startDemo()">
        퀴즈 더 풀기
      </button>
    </div>

    <div style="font-size:11px;color:var(--text-muted);text-align:center;padding:8px">
      * 데모용 모의 데이터입니다. 실제 투자와 다를 수 있습니다.
    </div>
  `;

  setTimeout(() => {
    const ctx = document.getElementById('pf-chart');
    if (!ctx) return;
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: pf.map(h => h.name),
        datasets: [{
          data: pf.map(h => h.currentPrice * h.quantity),
          backgroundColor: colors,
          borderWidth: 0,
          hoverOffset: 6,
        }],
      },
      options: {
        responsive: true,
        cutout: '65%',
        plugins: {
          legend: {
            position: 'right',
            labels: { color: '#555', font: { size: 12, family: 'Noto Sans KR' }, padding: 12 },
          },
        },
      },
    });
  }, 100);
}
</script>
</body>
</html>
